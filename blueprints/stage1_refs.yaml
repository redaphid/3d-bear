# Stage 1 — 20-candidate reference sweep for image-to-3D (see HANDOFF.md).
# Prompt is assembled IN-GRAPH: prompt_builder joins
#   $var.subject + $item.view + $item.pose + $item.mass + $item.mouth + $var.style
# and its STRING output is wired into t2i_qwen's `prompt` input.
# View language is geometric and sits right after the subject, because the
# previous round ignored the photography term "three-quarter view".
output_prefix: outputs/round2/ref
chunk: 5

# ---- clause library (YAML anchors; every item gets the full clause) ----------
_clauses:
  views:
    L34: &L34 >-
      The bear's body is rotated about 45 degrees so its left side faces the
      camera: its left shoulder, left ear and left flank are nearest to us
      while its right side recedes away from us; its head points the same way
      as its body, snout angled toward the left edge of the frame. The camera
      is at the bear's chest height, level with the bear.
    R34: &R34 >-
      The bear's body is rotated about 45 degrees so its right side faces the
      camera: its right shoulder, right ear and right flank are nearest to us
      while its left side recedes away from us; its head points the same way
      as its body, snout angled toward the right edge of the frame. The camera
      is at the bear's chest height, level with the bear.
    L34hi: &L34hi >-
      The bear's body is rotated about 45 degrees so its left side faces the
      camera: its left shoulder, left ear and left flank are nearest to us
      while its right side recedes away from us; its head points the same way
      as its body, snout angled toward the left edge of the frame. The camera
      is slightly above the bear's eye level looking gently downward, so the
      top of the head and both shoulders are clearly visible.
    R34hi: &R34hi >-
      The bear's body is rotated about 45 degrees so its right side faces the
      camera: its right shoulder, right ear and right flank are nearest to us
      while its left side recedes away from us; its head points the same way
      as its body, snout angled toward the right edge of the frame. The camera
      is slightly above the bear's eye level looking gently downward, so the
      top of the head and both shoulders are clearly visible.
    front: &front >-
      The bear faces the camera squarely and symmetrically, chest toward us,
      both ears and both shoulders equally visible, snout pointing straight at
      the camera. The camera is at the bear's chest height, level with the
      bear.
    Lprof: &Lprof >-
      The bear's body is turned about 70 degrees so we see mostly its left
      side, close to a profile: its left flank, left shoulder and the left side
      of its muzzle face the camera, its right side is hidden behind its body,
      and its snout points toward the left edge of the frame. The camera is at
      the bear's chest height, level with the bear.
    Rprof: &Rprof >-
      The bear's body is turned about 70 degrees so we see mostly its right
      side, close to a profile: its right flank, right shoulder and the right
      side of its muzzle face the camera, its left side is hidden behind its
      body, and its snout points toward the right edge of the frame. The camera
      is at the bear's chest height, level with the bear.
  poses:
    reach: &reach >-
      Its pose: both forelegs are raised high above its head and spread wide
      apart, paws open with claws splayed, chest lifted and open.
    bent: &bent >-
      Its pose: both forelegs are raised with the elbows bent, the paws held
      up at shoulder height in front of the chest, claws splayed.
    tall: &tall >-
      Its pose: it rears tall and straight, body stretched upward like a totem
      pole, both forelegs raised close beside the head with the paws near the
      ears, the whole figure narrow and vertical.
    swipe: &swipe >-
      Its pose: one foreleg is raised high above its head while the other
      foreleg sweeps forward across the chest mid-swipe, claws splayed.
  mass:
    heavy: &heavy >-
      Its build is massive and heavy: a thick short neck, a broad deep chest,
      a big round belly, and short thick limbs with wide paws.
    lean: &lean >-
      Its build is lean and athletic: long limbs, a longer neck, a narrow
      waist and a tapered muscular torso.
  mouth:
    open: &open >-
      Its mouth is wide open in a roar, showing teeth.
    closed: &closed >-
      Its jaw is closed with the lips drawn back in a snarl, teeth just
      showing.

# ---- design matrix -----------------------------------------------------------
foreach:
  - {id: a, seed: 1001, tag: "L34 reach heavy",   view: *L34,   pose: *reach, mass: *heavy, mouth: *open}
  - {id: b, seed: 1102, tag: "R34 reach heavy",   view: *R34,   pose: *reach, mass: *heavy, mouth: *open}
  - {id: c, seed: 1203, tag: "L34 bent heavy",    view: *L34,   pose: *bent,  mass: *heavy, mouth: *open}
  - {id: d, seed: 1304, tag: "R34 bent heavy",    view: *R34,   pose: *bent,  mass: *heavy, mouth: *open}
  - {id: e, seed: 1405, tag: "L34hi bent heavy",  view: *L34hi, pose: *bent,  mass: *heavy, mouth: *open}
  - {id: f, seed: 1506, tag: "R34hi reach heavy", view: *R34hi, pose: *reach, mass: *heavy, mouth: *open}
  - {id: g, seed: 1607, tag: "L34 tall heavy",    view: *L34,   pose: *tall,  mass: *heavy, mouth: *open}
  - {id: h, seed: 1708, tag: "R34 tall heavy",    view: *R34,   pose: *tall,  mass: *heavy, mouth: *open}
  - {id: i, seed: 1809, tag: "L34hi tall closed", view: *L34hi, pose: *tall,  mass: *heavy, mouth: *closed}
  - {id: j, seed: 1910, tag: "L34 swipe heavy",   view: *L34,   pose: *swipe, mass: *heavy, mouth: *open}
  - {id: k, seed: 2011, tag: "R34 swipe heavy",   view: *R34,   pose: *swipe, mass: *heavy, mouth: *open}
  - {id: l, seed: 2112, tag: "front bent heavy",  view: *front, pose: *bent,  mass: *heavy, mouth: *open}
  - {id: m, seed: 2213, tag: "front tall heavy",  view: *front, pose: *tall,  mass: *heavy, mouth: *open}
  - {id: n, seed: 2314, tag: "Lprof reach heavy", view: *Lprof, pose: *reach, mass: *heavy, mouth: *open}
  - {id: o, seed: 2415, tag: "Rprof bent closed", view: *Rprof, pose: *bent,  mass: *heavy, mouth: *closed}
  - {id: p, seed: 2516, tag: "L34 reach lean",    view: *L34,   pose: *reach, mass: *lean,  mouth: *open}
  - {id: q, seed: 2617, tag: "R34 bent lean",     view: *R34,   pose: *bent,  mass: *lean,  mouth: *open}
  - {id: r, seed: 2718, tag: "L34 bent closed",   view: *L34,   pose: *bent,  mass: *heavy, mouth: *closed}
  - {id: s, seed: 2819, tag: "R34 tall closed",   view: *R34,   pose: *tall,  mass: *heavy, mouth: *closed}
  - {id: t, seed: 2920, tag: "L34hi reach heavy", view: *L34hi, pose: *reach, mass: *heavy, mouth: *open}

# ---- pipeline (instantiated once per item) -----------------------------------
pipeline:
  - fragment: prompt_builder
    alias: pb
    params:
      subject: $var.subject
      view:    $item.view
      pose:    $item.pose
      mass:    $item.mass
      mouth:   $item.mouth
      style:   $var.style

  - fragment: t2i_qwen
    alias: ref
    inputs:
      prompt: $pb.prompt
    params:
      ksampler_seed: $item.seed
      int_steps_value: $var.steps
      float_cfg_value: $var.cfg
      emptysd3latentimage_width:  $var.size
      emptysd3latentimage_height: $var.size
      clip_text_encode_negative_prompt_text: $var.negative
      enable_4_steps_lora_value: false
      # Verified on disk via `comfy models list-folder loras`; the fragment's
      # decomposed default is NOT installed. The lora stays disabled via the
      # switch, but the loader node is still validated, so the name must exist.
      load_lora_lora_name: "Qwen-Image-Lightning-4steps-V1.0.safetensors"
