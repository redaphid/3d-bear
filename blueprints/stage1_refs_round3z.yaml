# ---- pipeline (instantiated once per item) -----------------------------------
# prompt_builder's six slots are reused as subject · view · pose · base · head · style.
pipeline:
  - fragment: prompt_builder
    alias: pb
    params:
      subject: *subject
      view:    $item.view
      pose:    $item.pose
      mass:    $item.base
      mouth:   $item.head
      style:   $item.style

  - fragment: t2i_zimage
    alias: ref
    inputs:
      prompt: $pb.prompt
    params:
      ksampler_seed: $item.seed
      negative: $var.negative
      emptysd3latentimage_width:  1024
      emptysd3latentimage_height: 1024
      load_clip_device: cpu
