# Stage 1, round 3z — POSE-ENGINEERED FOR THE PRINTER (Z-Image Turbo).
#
# Round 2z taught us that support % is a pose question: the red faces on every
# candidate were the undersides of horizontal forearms, the underside of the
# muzzle, the armpits and the crotch. This matrix only contains poses whose
# downward-facing surfaces are steep or pressed against the body:
#   skyroar  arms straight up overhead, head thrown back (jaw underside faces forward)
#   guard    elbows on the ribs, forearms vertical, paws beside the chin
#   clasp    elbows on the ribs, forearms steeply up, paws meet under the chin
#   oneup    one arm straight up, the other straight down the flank
#   stump    both arms down the flanks — the totem column
# and two ways of killing the crotch overhang: hind legs pressed together, or the
# bear standing on a boulder that is part of the sculpture (the pole/light goes
# into the rock). Half the matrix is the round-2 clay style, half a "cast bronze
# with matte patina" style that asks for defined anatomy (hump, brow, claws) so
# the reconstruction stops looking like a plush toy.
#
# Files land at D:/sync/Comfy/3d-bear/stage1_refs/round3z/ref/<id>_00001_.png
output_prefix: 3d-bear/stage1_refs/round3z/ref
chunk: 5

_clauses:
  subject: &subject >-
    A full-body sculpture of a grizzly bear rearing upright on its hind legs,
    massive and heavy: a pronounced shoulder hump, a thick short neck, a broad
    deep chest, a big round belly, short thick limbs and wide paws with
    distinct claws. The entire animal is visible from the top of its head to
    the bottom of whatever it stands on.
  views:
    L34: &L34 >-
      The bear's body is rotated about 45 degrees so its left side faces the
      camera: its left shoulder, left ear and left flank are nearest to us
      while its right side recedes away from us; its head points the same way
      as its body, snout angled toward the left edge of the frame. The camera
      is at the bear's chest height, level with the bear.
    R34: &R34 >-
      The bear's body is rotated about 45 degrees so its right side faces the
      camera: its right shoulder, right ear and right flank are nearest to us
      while its left side recedes away from us; its head points the same way
      as its body, snout angled toward the right edge of the frame. The camera
      is at the bear's chest height, level with the bear.
  poses:
    skyroar: &skyroar >-
      Its pose: both forelegs are raised straight up overhead, upper arms
      vertical beside the head, forearms vertical, paws open toward the sky
      with claws splayed.
    guard: &guard >-
      Its pose: both forelegs are bent sharply at the elbow with the elbows
      pressed tight against the ribs and the forearms pointing straight up,
      paws raised beside the chin with claws splayed, like a boxer's guard.
    clasp: &clasp >-
      Its pose: both forelegs are bent with the elbows held against the ribs
      and the forearms angled steeply upward, the two paws meeting together
      just under the chin.
    oneup: &oneup >-
      Its pose: its left foreleg is raised straight up beside its head with
      the paw open and claws splayed, while its right foreleg hangs straight
      down along its right flank with the paw resting against its thigh.
    stump: &stump >-
      Its pose: both forelegs hang straight down at its sides, pressed against
      the flanks, the whole figure tall, narrow and columnar like a totem pole.
  bases:
    legs: &legs >-
      Its hind legs are pressed together with the thighs and lower legs
      touching so there is no gap between them, and the two hind paws stand
      flat side by side on the ground.
    rock: &rock >-
      It stands on top of a single large smooth rounded boulder with a flat
      bottom; its hind paws are planted on the top of the boulder and the
      boulder is part of the same sculpture in the same material. The boulder
      is the only thing under the bear.
  heads:
    sky: &sky >-
      Its head is thrown back with the muzzle pointing straight up at the sky
      and the mouth wide open in a roar, so the throat and the underside of
      the jaw face forward.
    closed: &closed >-
      Its head faces forward with the jaw closed and the lips drawn back in a
      snarl, teeth just showing.
    tuck: &tuck >-
      Its head is lowered with the chin tucked down against the chest, jaw
      closed, glaring forward from under a heavy brow.
  styles:
    clay: &clay >-
      Rendered as a matte clay maquette: smooth simplified sculptural forms,
      soft rounded volumes, no fur texture, no hair strands, uniform light
      grey clay, completely non-reflective matte surface. The whole sculpture
      is centred in the frame with generous empty margin on all sides,
      nothing cropped, nothing touching the frame edge. Plain flat uniform
      mid-grey studio background, seamless, empty, no scene, no environment,
      no floor line, no horizon. Perfectly even flat diffuse shadowless
      lighting from all directions, no cast shadow, no drop shadow, no
      contact shadow, no dark areas, very low contrast. Clean product
      photograph of a sculpture.
    bronze: &bronze >-
      Rendered as a cast bronze sculpture with a uniform matte light-grey
      patina: smooth continuous surfaces with clearly defined muscle masses,
      a heavy brow, a long broad muzzle, distinct ears and claws, no fur
      strands, no surface texture, completely non-reflective. The whole
      sculpture is centred in the frame with generous empty margin on all
      sides, nothing cropped, nothing touching the frame edge. Plain flat
      uniform mid-grey studio background, seamless, empty, no scene, no
      environment, no floor line, no horizon. Perfectly even flat diffuse
      shadowless lighting from all directions, no cast shadow, no drop
      shadow, no contact shadow, no dark areas, very low contrast. Clean
      product photograph of a sculpture.

# ---- design matrix: 5 poses x 2 bases x 2 styles, heads chosen to suit ---------
foreach:
